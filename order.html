<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งซื้อสินค้า - Body Scent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="container navbar">
        <div class="logo"><a href="index.html">BODY SCENT</a></div>
        <nav class="nav-links">
            <a href="index.html">หน้าแรก</a>
            <a href="product.html">สินค้าทั้งหมด</a>
        </nav>
    </header>

    <main class="container">
        <section class="form-container">
            <h1 class="brand-font" style="font-size: 2.2rem; text-align: center; margin-bottom: 0.5rem;">แบบฟอร์มสั่งซื้อ</h1>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2.5rem;">กรอกข้อมูลสำหรับจัดส่งสินค้า</p>

            <form id="orderForm">
                <div class="form-group">
                    <label for="items">รายการสินค้าที่สั่งซื้อ</label>
                    <input type="text" id="items" name="items" readonly placeholder="กำลังโหลดข้อมูล...">
                </div>

                <div class="form-group">
                    <label for="total">จำนวนเงินรวม (บาท)</label>
                    <input type="text" id="total" name="total" readonly placeholder="0">
                </div>

                <div class="form-group">
                    <label for="customerName">ชื่อ-นามสกุล ผู้รับ *</label>
                    <input type="text" id="customerName" name="customerName" required placeholder="ระบุชื่อและนามสกุล">
                </div>

                <div class="form-group">
                    <label for="contact">เบอร์โทรศัพท์ / Line ID *</label>
                    <input type="text" id="contact" name="contact" required placeholder="เช่น 081-234-5678 หรือ ID Line">
                </div>

                <div class="form-group">
                    <label for="note">หมายเหตุเพิ่มเติม (ถ้ามี)</label>
                    <textarea id="note" name="note" rows="3" placeholder="ระบุที่อยู่จัดส่ง หรือข้อมูลเพิ่มเติม"></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-full">ยืนยันสั่งซื้อ</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Body Scent. Essence of Elegance. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
